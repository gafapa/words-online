<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Words Online</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <input id="doc-title" class="doc-title" placeholder="Untitled document" aria-label="Document title" />
      <div class="actions">
        <span id="presence" class="presence" title="People in this document"></span>
        <span id="peer-status" class="status offline">Connecting…</span>
        <button id="btn-share" class="primary">Share</button>
        <details class="menu">
          <summary>File</summary>
          <div class="menu-items">
            <button id="btn-new">New document</button>
            <button id="btn-docs">My documents…</button>
            <button id="btn-open-file">Open file (Word, ODT…)</button>
            <hr />
            <button data-export="docx">Download Word (.docx)</button>
            <button data-export="odt">Download OpenDocument (.odt)</button>
            <button data-export="html">Download HTML</button>
            <button data-export="txt">Download text</button>
            <button id="btn-print">Print / PDF</button>
          </div>
        </details>
        <input id="user-name" class="user-name" aria-label="Your name" />
      </div>
    </header>

    <main class="page-wrap">
      <div id="editor"></div>
    </main>

    <input id="file-input" type="file" hidden />

    <dialog id="dlg-share">
      <form method="dialog" class="dlg">
        <h2>Share this document</h2>
        <p>Anyone who opens this link can edit the document with you in real time.</p>
        <div class="code-row">
          <input id="share-link" readonly />
          <button type="button" id="btn-copy-share">Copy</button>
        </div>
        <canvas id="share-qr" class="qr"></canvas>
        <p class="hint">
          The link contains the document's secret key. Edits travel directly between browsers; public relays are
          only used to find each other.
        </p>
        <div class="dlg-actions">
          <button value="cancel" class="primary">Done</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-docs">
      <form method="dialog" class="dlg">
        <h2>Documents in this browser</h2>
        <ul id="doc-list" class="doc-list"></ul>
        <div class="dlg-actions">
          <button value="cancel">Close</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
