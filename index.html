<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Words Online</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231a73e8'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='Arial'>W</text></svg>" />
  </head>
  <body>
    <div class="app">
      <header class="appbar">
        <div class="appbar-main">
          <a class="app-logo" href="#" title="Words Online">W</a>
          <div class="title-block">
            <div class="title-row">
              <input id="doc-title" class="doc-title" placeholder="Untitled document" aria-label="Document title" spellcheck="false" />
              <span id="save-state" class="save-state"></span>
            </div>
            <nav id="menubar" class="menubar" aria-label="Menu"></nav>
          </div>
          <div class="appbar-actions">
            <span id="presence" class="presence" title="People in this document"></span>
            <span id="peer-status" class="status offline">Connecting…</span>
            <button id="btn-share" class="primary share-btn">Share</button>
            <input id="user-name" class="user-name" aria-label="Your name" title="Your name, as others see it" />
          </div>
        </div>
        <div id="toolbar" class="toolbar" role="toolbar" aria-label="Formatting"></div>
      </header>

      <div id="find-panel" class="find-panel" hidden>
        <div class="find-row">
          <input data-find placeholder="Find in document" aria-label="Find" />
          <span data-count class="find-count"></span>
          <button type="button" data-prev title="Previous (Shift+Enter)">↑</button>
          <button type="button" data-next title="Next (Enter)">↓</button>
          <button type="button" data-close title="Close (Esc)">✕</button>
        </div>
        <div class="find-row" data-replace-row>
          <input data-replace placeholder="Replace with" aria-label="Replace with" />
          <button type="button" data-replace-one>Replace</button>
          <button type="button" data-replace-all>Replace all</button>
        </div>
        <label class="find-option"><input type="checkbox" data-case /> Match case</label>
      </div>

      <main id="canvas" class="canvas">
        <div id="zoom-wrap" class="zoom-wrap">
          <div id="paper" class="paper">
            <div id="first-header" class="page-header"></div>
            <div id="editor"></div>
            <div id="page-tail" class="page-tail"></div>
          </div>
        </div>
      </main>

      <footer class="statusbar">
        <span id="status-page">Page 1 of 1</span>
        <span id="status-words">0 words</span>
        <span id="status-chars" class="hide-narrow">0 characters</span>
        <span class="spacer"></span>
        <span class="hide-narrow">Zoom</span>
        <input id="zoom-range" type="range" min="50" max="200" step="10" value="100" aria-label="Zoom" class="hide-narrow" />
        <button id="zoom-value" class="zoom-value" title="Reset zoom">100%</button>
      </footer>
    </div>

    <input id="file-input" type="file" hidden />
    <input id="image-input" type="file" accept="image/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
