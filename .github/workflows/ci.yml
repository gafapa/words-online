name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned draw.io release the shape libraries are generated from.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/draw-*.war
          key: drawio-war-${{ hashFiles('scripts/drawio.json') }}
      # Fails when a production dependency has no license (also run by the build).
      - name: Third-party licenses
        run: node scripts/third-party-notices.mjs --check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (grammar rules)
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  relay:
    name: Relay (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - run: go vet ./...
      - run: go test ./...
